<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" data-site-favicon type="image/png" sizes="96x96" href="/favicon-dark-96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Consulta temperatura, umidità, pressione e storico della stazione meteorologica del Liceo Teresio Olivelli di Pavia, quando disponibili." />
    <link rel="canonical" href="https://meteolivelli.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MeteOlivelli" />
    <meta property="og:title" content="MeteOlivelli | Meteo scolastico a Pavia" />
    <meta property="og:description" content="Consulta temperatura, umidità, pressione e storico della stazione meteorologica del Liceo Teresio Olivelli di Pavia, quando disponibili." />
    <meta property="og:url" content="https://meteolivelli.vercel.app/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MeteOlivelli",
        "alternateName": "MeteOlivelli - Il meteo a scuola",
        "url": "https://meteolivelli.vercel.app/"
      }
    </script>
    <meta name="google-site-verification" content="nzz3_3WRLIPG23GhjXi26u2bCu-Y3KpMqKkaeZAmH-A" />
    <meta name="theme-color" content="#05080e" />
    <script>
      try {
        const savedTheme = localStorage.getItem('meteolivelli-theme')
        const systemTheme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : systemTheme
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f7f5f2' : '#101010'
        const favicon = document.querySelector('link[data-site-favicon]')
        if (favicon) favicon.href = theme === 'light' ? '/favicon-light-96.png' : '/favicon-dark-96.png'
      } catch {
        const theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f7f5f2' : '#101010'
        const favicon = document.querySelector('link[data-site-favicon]')
        if (favicon) favicon.href = theme === 'light' ? '/favicon-light-96.png' : '/favicon-dark-96.png'
      }
    </script>
    <title>MeteOlivelli | Meteo scolastico a Pavia</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main class="noscript-page">
        <h1>MeteOlivelli</h1>
        <p>Il progetto meteo del Liceo Teresio Olivelli di Pavia, per esplorare temperatura, umidità e pressione attraverso i dati della stazione scolastica.</p>
        <p>Per consultare e aggiornare le misurazioni è necessario attivare JavaScript. Questa pagina statica non mostra dati live.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
